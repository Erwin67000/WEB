# Cloudflare Worker + assets SPA (Vite dist)
# Deploy : npm run deploy  (ou pipeline Cloudflare : npm run build && npx wrangler deploy)
name = "philaedesign2"
main = "worker/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

# Secrets Stripe (jamais dans ce fichier) :
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put SITE_URL
# Local : .dev.vars

[vars]
CORS_ORIGINS = "https://philae.design,https://www.philae.design,http://localhost:3102"

[assets]
directory = "./dist"
binding = "ASSETS"
# Le Worker traite /api/* en premier ; le reste = SPA.
# /atelier-cad* n’existe qu’en Vite dev : le Worker renvoie 404 (pas de fallback SPA).
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/atelier-cad", "/atelier-cad/*"]

[[d1_databases]]
binding = "DB"
database_name = "philae-orders"
database_id = "d6b30c2c-f666-463d-a8c7-8fbf6a320e2f"
