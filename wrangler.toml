# Cloudflare Worker + assets SPA (Vite dist)
# Deploy : npm run deploy
name = "philaedesign2"
main = "worker/index.js"
compatibility_date = "2025-03-01"
workers_dev = true

# Secrets (ne pas mettre dans ce fichier) :
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put SITE_URL
# Local : copier .dev.vars.example → .dev.vars

[assets]
directory = "./dist"
binding = "ASSETS"
# Le Worker traite /api/* en premier ; le reste = SPA
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Base commandes — créer avec :
#   npx wrangler d1 create philae-orders
# puis coller database_id ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "philae-orders"
# Remplacer après `wrangler d1 create philae-orders` :
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "local-philae-orders"
